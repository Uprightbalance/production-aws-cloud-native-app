name: Build and Push Backend Image

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: backend

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      # Assume AWS Role via OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::10741811189:role/github-ci-role
          aws-region: us-east-1

      # Login to ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build Docker Image (BACKEND DIRECTORY)
      - name: Build Image
        run: |
          cd mrbaffo-backend
          docker build -t $ECR_REPOSITORY .

      # Tag Image
      - name: Tag Image
        run: |
          docker tag backend:latest ${{ steps.login-ecr.outputs.registry }}/backend:${{ github.sha }}

      # Push Image
      - name: Push Image
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/backend:${{ github.sha }}
